[package]
name = "agenthand"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "agenthand MCP server — Rust build (the public submission build; Python package remains as fallback install)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
png = "0.17"
flate2 = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Real DNS resolver for the Meta client (meta.rs): the libc stub's
# unconnected-UDP sends are refused by a class of sandboxed egress
# policies, so resolution runs over TCP to the resolv.conf
# nameservers instead. NOT reqwest's `hickory-dns` feature: that
# transport sends UDP unconnected and fails the same way.
hickory-resolver = "0.25"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
jpeg-decoder = "0.3"
fs2 = "0.4"

[dev-dependencies]
# Test-only: decode the QR sidecar back (roundtrip proof) — rqrr
# reads an image-crate buffer; neither crate ships in the binary.
rqrr = "0.9"
image = "0.25"

[profile.release]
opt-level = 3
# Arithmetic on untrusted geometry must panic (contained at the
# tool/decode boundaries) rather than wrap silently into a wrong
# size or index — the f8961a1 SPS crop wrap is the standing proof
# this codebase needs the checks. Validated against the frozen
# replay parity gate after enabling (2026-10-31, audit A3).
overflow-checks = true
