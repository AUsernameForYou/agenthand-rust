[package]
name = "agenthand"
version = "0.2.0"
edition = "2021"
description = "agenthand MCP server — Rust build (the public submission build; Python package remains as fallback install)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
flate2 = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
jpeg-decoder = "0.3"
fs2 = "0.4"

[profile.release]
opt-level = 3
